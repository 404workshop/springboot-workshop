# Load .env file if present (optional, for local production profile)
spring.config.import=optional:file:.env[.properties]
# Server Configuration
server.port=8080

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# Option A: Default H2 In-Memory Database (Zero installation friction for 200 students)
spring.datasource.url=jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Option B: PostgreSQL (Uncomment below to switch to PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
# spring.datasource.username=postgres
# spring.datasource.password=secret
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Use org.hibernate.dialect.PostgreSQLDialect when using PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
